function vars(c,extra={}){const p=posOf(c);return Object.assign({aday:c.ad,pozisyon:p.ad,lokasyon:p.lokasyon,uzman:p.uzman,yonetici:p.yonetici,talepNo:p.id,asama:c.asama,sirket:S.set.sirket,baslangic:c.baslangic||'-',
 link:Object.keys(ASSESS).map(k=>c.as?.[k]?.link?`• ${ASSESS[k]}: ${c.as[k].link}`:'').filter(Boolean).join('\n')||'(bağlantılar ayrıca iletilecektir)'},extra)}

function tplFor(trig){const ex=S.tpl.filter(t=>t.auto&&t.tr.includes(trig));if(ex.length)return ex;return S.tpl.filter(t=>t.auto&&t.tr.some(x=>x.endsWith('*')&&trig.startsWith(x.slice(0,-1))))}
function queueMail(t,c,extra){const v=vars(c,extra);const to=t.to==='aday'?c.email:(S.set.yoneticiMail?.[posOf(c).yonetici]||posOf(c).yonetici);
 if(t.to==='aday'&&!c.email)return toast('Adayın e-postası yok, mail kuyruğa alınamadı');
 S.outbox.unshift({id:uid(),to,cand:c.id,tpl:t.ad,sub:fill(t.sub,v),body:fill(t.body,v),status:'Bekliyor',at:Date.now()+(t.delay||0)*36e5,created:new Date().toISOString()});
 (c.mails=c.mails||[]).push({t:today(),m:t.ad});}

async function processQueue(force){for(const m of S.outbox.filter(m=>m.status==='Bekliyor'&&(force||m.at<=Date.now()))){
 try{if(S.set.mailMode==='webhook'){if(!S.set.mailUrl)throw Error('Webhook URL tanımlı değil');const r=await fetch(S.set.mailUrl,{method:'POST',headers:{'Content-Type':'application/json',...(S.set.mailKey?{Authorization:'Bearer '+S.set.mailKey}:{})},body:JSON.stringify({from:S.set.gonderen,to:m.to,subject:m.sub,text:m.body})});if(!r.ok)throw Error('HTTP '+r.status)}
  else if(S.set.mailMode==='mailto'){window.open(`mailto:${m.to}?subject=${encodeURIComponent(m.sub)}&body=${encodeURIComponent(m.body)}`)}
  m.status='Gönderildi';m.sent=new Date().toISOString()}catch(e){m.status='Hata';m.err=e.message}}save();}

/* ===== Aşama yönetimi (kurallar) ===== */
function setStage(c,st,silent){const p=posOf(c);if(c.asama===st)return true;
 if(st==='İşe Alındı'){const h=S.cands.find(x=>x.talepNo==c.talepNo&&x.asama==='İşe Alındı'&&x.id!==c.id);if(h){toast(`Kural 2: ${p.id} talebinde zaten işe alınan aday var (${h.ad}). Her talepte tek aday işe alınır; yeni talep açın.`);return false}}
 const prev=c.asama;c.asama=st;c.stageDate=today();(c.hist=c.hist||[]).push({t:today(),m:`${prev} → ${st}`});
 const dmap={'Öngörüşme':'ongorusme','Yönetici Görüşmesi':'yoneticiGorusme','Sınav Aşaması':'sinavGonderim','Kişi Onay':'kisiOnay','Teklif':null};const f=dmap[st];if(f&&!c[f])c[f]=today();
 if(st==='Teklif'){p.teklifTarihi=p.teklifTarihi||today();if(c.kisiOnay&&!c.kisiOnayOnay)c.kisiOnayOnay=today()}
 if(st==='Kişi Onay')p.kisiOnayTarihi=p.kisiOnayTarihi||today();
 if(ROLE_MAP[st]&&p.id&&ROLE_ST.indexOf(ROLE_MAP[st])>ROLE_ST.indexOf(p.asama))p.asama=ROLE_MAP[st];
 if(st==='İşe Alındı'){Object.assign(p,{adayAdi:c.ad,kaynak:c.kaynak,baslangic:c.baslangic||p.baslangic,asama:'13. İşe Alındı'});}
 log(`${c.ad}: ${prev} → ${st}`);
 if(st==='Sınav Aşaması'&&S.set.autoInvite){Promise.all(Object.keys(ASSESS).map(k=>invite(c,k,true))).then(()=>{trigger(c,st);save();rerender()});}
 else if(!silent)trigger(c,st);
 save();
 if(st==='İşe Alındı'){const rest=S.cands.filter(x=>x.talepNo==c.talepNo&&x.id!==c.id&&!isClosed(x.asama)&&x.asama!=='İşe Alındı');
  if(rest.length)modal(`<h3>İşe alım tamamlandı 🎉</h3><p>${p.id} talebinde süreci açık <b>${rest.length}</b> aday var. Kural 7: Pozisyon kapatılmadan önce tüm adaylara dönüş yapılmalı.</p><label>Sonlandırma gerekçesi</label><select id="rr"><option>Süreç Sonlandı - Alternatif Aday</option><option>Süreç Sonlandı - Yedek Aday</option></select><p class="row"><button class="btn p" onclick="closeRest(${p.id},'${c.id}')">Kalanları sonlandır, bilgilendir ve pozisyonu kapat</button><button class="btn" onclick="closeM()">Sonra</button></p>`);
  else{p.durum='Kapalı';log(`${p.id} pozisyonu kapatıldı`);save()}}
 return true}
function closeRest(pid,cid){const r=$('rr').value;S.cands.filter(x=>x.talepNo==pid&&x.id!==cid&&!isClosed(x.asama)&&x.asama!=='İşe Alındı').forEach(x=>setStage(x,r));const p=S.pos.find(p=>p.id==pid);p.durum='Kapalı';log(`${pid} pozisyonu kapatıldı`);save();closeM();rerender();toast('Adaylar bilgilendirildi, pozisyon kapatıldı')}
function canClose(p){const open=S.cands.filter(c=>c.talepNo==p.id&&!isClosed(c.asama)&&c.asama!=='İşe Alındı');return open}

/* ===== Değerlendirme API'leri ===== */
async function api(k,path,method,body){const a=S.set.api[k];
 if(S.set.demoApi||!a.url){await new Promise(r=>setTimeout(r,300));if(path.startsWith('/invitations')&&method==='POST'){const id='DEMO-'+uid();return{id,url:`https://demo-assess.example/${k}/${id}`}}
  return Math.random()<.25?{status:'pending'}:{status:'completed',score:Math.round(35+Math.random()*60),report_url:'https://demo-assess.example/report',level:k==='eng'?['A2','B1','B2','C1'][Math.floor(Math.random()*4)]:undefined,profile:k==='per'?['Analitik','Sosyal','Lider','Destekleyici'][Math.floor(Math.random()*4)]:undefined}}
 const r=await fetch(a.url.replace(/\/$/,'')+path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+a.key},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error(`${a.name}: HTTP ${r.status}`);return r.json()}
async function invite(c,k,quiet){try{const p=posOf(c);const r=await api(k,'/invitations','POST',{test_id:S.set.api[k].test,candidate:{name:c.ad,email:c.email},reference:c.id,position:p.ad});
 c.as=c.as||{};c.as[k]={status:'Gönderildi',inviteId:r.id,link:r.url,sent:today()};c.sinavGonderim=c.sinavGonderim||today();log(`${c.ad}: ${ASSESS[k]} daveti gönderildi`);save();if(!quiet){toast(ASSESS[k]+' daveti oluşturuldu');rerender()}}catch(e){toast('API hatası: '+e.message)}}
async function fetchResult(c,k,quiet){const a=c.as?.[k];if(!a?.inviteId)return;try{const r=await api(k,'/results/'+encodeURIComponent(a.inviteId),'GET');
 if(r.status==='completed'){Object.assign(a,{status:'Tamamlandı',score:r.score,report:r.report_url,level:r.level,profile:r.profile,done:today()});const min=+S.set.api[k].min||0;a.pass=r.score>=min;log(`${c.ad}: ${ASSESS[k]} sonucu ${r.score}`)}
 else a.status='Bekleniyor';save();if(!quiet){rerender();toast(ASSESS[k]+': '+a.status)}}catch(e){toast('API hatası: '+e.message)}}
async function syncAll(){const l=S.cands.filter(c=>c.as);for(const c of l)for(const k in c.as)if(c.as[k].status!=='Tamamlandı')await fetchResult(c,k,true);rerender();toast('Tüm sınav sonuçları güncellendi')}

function editCand(id,talep){const c=id?S.cands.find(x=>x.id===id):{talepNo:talep||'',asama:'Başvuru',kvkk:false};
 modal(`<div class="row sp"><h3>${id?'Adayı Düzenle':'Yeni Aday'}</h3><button class="btn s" onclick="closeM()">✕</button></div>${form(C_F,c)}<div style="margin-top:10px"><label>Özgeçmiş (CV)</label><input type="file" id="cv" accept=".pdf,.doc,.docx"></div><p class="mut sm">${id?'Aşama değişikliği bu formdan yapılırsa otomatik e-posta tetiklenir.':'Kayıtta "Başvuru Alındı" maili otomatik gönderilir.'}</p><p class="row"><button class="btn p" onclick="saveCand('${id||''}')">Kaydet</button></p>`)}
async function saveCand(id){const c=id?S.cands.find(x=>x.id===id):{id:uid(),created:today(),stageDate:today(),hist:[],as:{},notes:[]};const prevSt=c.asama;const tmp=readForm(C_F,{...c});
 if(!tmp.ad||!tmp.talepNo)return toast('Aday adı ve talep numarası zorunlu');
 const dup=S.cands.find(x=>x.id!==c.id&&((tmp.email&&x.email===tmp.email)||(tmp.tel&&tmp.tel.length>6&&x.tel===tmp.tel)));if(dup&&!saveCand.ok)return ask(`Olası mükerrer kayıt: ${dup.ad} (${posOf(dup).ad||''}). Yine de kaydedilsin mi?`,()=>{saveCand.ok=1;saveCand(id).finally(()=>saveCand.ok=0)});
 const f=$('cv').files[0];if(f){if(f.size>1.5e6)return toast('CV 1.5MB üzerinde; tarayıcı depolaması için küçültün.');tmp.cv={name:f.name,data:await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}}
 const newSt=tmp.asama;Object.assign(c,tmp,{asama:prevSt||'Başvuru'});
 if(!id){c.asama=newSt;c.hist.push({t:today(),m:'Aday oluşturuldu ('+newSt+')'});S.cands.push(c);log('Yeni aday: '+c.ad);trigger(c,newSt)}else if(newSt!==prevSt){if(!setStage(c,newSt))return}
 save();closeM();rerender();toast('Aday kaydedildi')}
function stageSel(c){return`<select onchange="if(setStage(S.cands.find(x=>x.id==='${c.id}'),this.value)){rerender();openCand('${c.id}')}">${[...ACTIVE,...CLOSED].map(s=>`<option ${s===c.asama?'selected':''}>${s}</option>`).join('')}</select>`}
function nextStage(c){const i=ACTIVE.indexOf(c.asama);return i>=0&&i<ACTIVE.length-1?ACTIVE[i+1]:null}
function openCand(id){const c=S.cands.find(x=>x.id===id);if(!c)return;const p=posOf(c);const nx=nextStage(c);const ints=S.ints.filter(i=>i.cand===id);
 drawer(`<div class="row sp"><div><h1>${esc(c.ad)}</h1><div class="mut">${esc(p.id)} · ${esc(p.ad)} · ${esc(p.lokasyon)}</div></div><button class="btn s" onclick="closeD()">✕</button></div>
 <div class="row" style="margin:14px 0">${stTag(c.asama)}${c.kvkk?'<span class="tag t-ok">KVKK ✓</span>':'<span class="tag t-bad">KVKK onayı yok</span>'}<span class="tag">${esc(c.kaynak||'Kaynak yok')}</span>${c.cv?`<a class="btn s" download="${esc(c.cv.name)}" href="${c.cv.data}">📄 CV</a>`:''}</div>
 <div class="row">${nx&&!isClosed(c.asama)?`<button class="btn p" onclick="setStage(S.cands.find(x=>x.id==='${id}'),'${nx}')&&(rerender(),openCand('${id}'))">→ ${nx}</button>`:''}<div style="flex:1;min-width:220px">${stageSel(c)}</div></div>
 <div class="row" style="margin-top:10px"><button class="btn s" onclick="editCand('${id}')">Düzenle</button><button class="btn s" onclick="schedule('${id}')">📅 Mülakat Planla</button><button class="btn s" onclick="manualMail('${id}')">✉ Mail Gönder</button><button class="btn s" onclick="toPool('${id}')">Havuza Ekle</button><button class="btn s d" onclick="anon('${id}')">KVKK Sil/Anonimleştir</button></div>
 <div class="glass card" style="margin-top:16px"><h3>Sınav & Envanter (API)</h3>${Object.keys(ASSESS).map(k=>{const a=c.as?.[k];return`<div class="row sp" style="margin:8px 0"><div><b>${ASSESS[k]}</b><div class="sm mut">${a?`${a.status}${a.score!=null?` · Puan: <b>${a.score}</b>${a.level?' · '+a.level:''}${a.profile?' · '+a.profile:''} · ${a.pass?'<span class="tag t-ok">Eşik üstü</span>':'<span class="tag t-bad">Eşik altı</span>'}`:''}${a.link?` · <a href="${esc(a.link)}" target="_blank" style="color:var(--acc)">bağlantı</a>`:''}${a.report?` · <a href="${esc(a.report)}" target="_blank" style="color:var(--acc)">rapor</a>`:''}`:'Gönderilmedi'}</div></div><div class="row"><button class="btn s" onclick="invite(S.cands.find(x=>x.id==='${id}'),'${k}').then(()=>openCand('${id}'))">${a?'Yeniden':''} Davet</button>${a?`<button class="btn s" onclick="fetchResult(S.cands.find(x=>x.id==='${id}'),'${k}').then(()=>openCand('${id}'))">Sonuç Çek</button>`:''}</div></div>`}).join('')}
 ${Object.values(c.as||{}).some(a=>a.status==='Tamamlandı'&&!a.pass)&&!isClosed(c.asama)?`<button class="btn s d" onclick="setStage(S.cands.find(x=>x.id==='${id}'),'Süreç Sonlandı - Envanter Süreci')&&(rerender(),openCand('${id}'))">Eşik altı → Süreci Sonlandır (Envanter)</button>`:''}</div>
 <div class="glass card" style="margin-top:16px"><h3>Bilgiler</h3><div class="fg sm">${C_F.filter(f=>!['talepNo','ad','asama','notlar','kvkk'].includes(f[0])).map(([k,l])=>`<div><span class="mut">${l}</span><br>${esc(c[k]||'-')}</div>`).join('')}</div>${c.notlar?`<p>${esc(c.notlar)}</p>`:''}</div>
 <div class="glass card" style="margin-top:16px"><h3>Mülakatlar & Değerlendirme Formları</h3>${ints.map(i=>`<div class="row sp" style="margin:6px 0"><span>${esc(i.tur)} · ${i.date} ${i.time} · ${esc(i.gorusmeci)}</span>${i.sonuc?`<span class="tag ${i.sonuc==='Olumlu'?'t-ok':i.sonuc==='Olumsuz'?'t-bad':'t-warn'}">${i.sonuc} (${i.puan}/5)</span>`:`<button class="btn s" onclick="score('${i.id}')">Form Doldur</button>`}</div>`).join('')||'<span class="mut sm">Mülakat yok.</span>'}</div>
 <div class="glass card" style="margin-top:16px"><h3>Notlar</h3>${(c.notes||[]).map(n=>`<div class="sm" style="margin:4px 0"><span class="mut">${n.t}</span> · ${esc(n.m)}</div>`).join('')}<div class="row" style="margin-top:8px"><input id="nt" placeholder="Not ekle..." style="flex:1"><button class="btn s" onclick="addNote('${id}')">Ekle</button></div></div>
 <div class="grid g2" style="margin-top:16px"><div class="glass card"><h3>Süreç Geçmişi</h3><div class="tl">${(c.hist||[]).slice().reverse().map(h=>`<div><span class="mut">${h.t}</span><br>${esc(h.m)}</div>`).join('')}</div></div><div class="glass card"><h3>Gönderilen E-postalar</h3><div class="tl">${S.outbox.filter(m=>m.cand===id).map(m=>`<div><span class="mut">${m.created.slice(0,10)}</span> ${esc(m.tpl)} <span class="tag ${m.status==='Gönderildi'?'t-ok':m.status==='Hata'?'t-bad':'t-warn'}">${m.status}</span></div>`).join('')||'-'}</div></div></div>`)}
function addNote(id){const v=$('nt').value.trim();if(!v)return;const c=S.cands.find(x=>x.id===id);(c.notes=c.notes||[]).push({t:today(),m:v});save();openCand(id)}
function anon(id,ok){if(!ok)return ask('Adayın kişisel verileri KVKK kapsamında anonimleştirilecek. Emin misiniz?',()=>anon(id,1));const c=S.cands.find(x=>x.id===id);Object.assign(c,{ad:'Anonim Aday #'+id.slice(0,4),email:'',tel:'',cv:null,notlar:'',notes:[],beklenti:'',anon:true});log('KVKK anonimleştirme: '+id);save();closeD();rerender()}
function toPool(id){const c=S.cands.find(x=>x.id===id);S.refs.push({id:uid(),ad:c.ad,email:c.email,tel:c.tel,referans:c.kaynak,uygun:posOf(c).ad,notlar:c.notlar});log(c.ad+' havuza eklendi');save();toast('Aday havuzuna eklendi')}
function bulk(){const ids=[...document.querySelectorAll('.ck:checked')].map(x=>x.value);if(!ids.length)return toast('Önce aday seçin');
 modal(`<h3>${ids.length} aday için toplu işlem</h3><label>Yeni aşama</label><select id="bs">${[...ACTIVE,...CLOSED].map(s=>`<option>${s}</option>`).join('')}</select><p class="mut sm">İlgili otomatik e-postalar her aday için tetiklenir.</p><p class="row"><button class="btn p" onclick="const s=$('bs').value;[${ids.map(i=>`'${i}'`)}].forEach(i=>setStage(S.cands.find(x=>x.id===i),s));closeM();rerender();toast('Güncellendi')">Uygula</button><button class="btn" onclick="exportSel([${ids.map(i=>`'${i}'`)}])">Seçilenleri Excel'e aktar</button></p>`)}

V.pipe=()=>{head('Aday Akışı','Kartı sürükleyip bırakın; aşama, tarihler, pozisyon aşaması ve e-postalar otomatik güncellenir.');
 const L=S.cands.filter(c=>!filt.kp||c.talepNo==filt.kp);
 $('view').innerHTML=`<div class="flt"><select onchange="filt.kp=this.value;V.pipe()">${opts('POS',filt.kp)}</select></div><div class="kan">${[...ACTIVE,'__x'].map(s=>{const cs=s==='__x'?L.filter(c=>isClosed(c.asama)):L.filter(c=>c.asama===s);
 return`<div class="glass col" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropC(event,'${s}')"><h4><span>${s==='__x'?'✕ Sonlanan / Red':s}</span><span class="cnt">${cs.length}</span></h4>${cs.map(c=>`<div class="kc" draggable="true" ondragstart="event.dataTransfer.setData('t','${c.id}')" onclick="openCand('${c.id}')"><b>${esc(c.ad)}</b><span class="mut">${esc(posOf(c).ad)}</span>${s==='__x'?`<br><span class="sm">${esc(c.asama)}</span>`:''}<div class="row sp sm" style="margin-top:4px"><span>${esc(c.kaynak||'')}</span><span class="${days(c.stageDate,today())>7?'tag t-bad':'mut'}">${days(c.stageDate,today())??0}g</span></div></div>`).join('')}</div>`}).join('')}</div>`};
function dropC(e,s){e.preventDefault();const c=S.cands.find(x=>x.id===e.dataTransfer.getData('t'));if(!c)return;
 if(s==='__x')return modal(`<h3>${esc(c.ad)} – süreci sonlandır</h3><label>Gerekçe (Kurallar 3-6)</label><select id="rs">${CLOSED.map(x=>`<option>${x}</option>`).join('')}</select><p class="mut sm">"Olumsuz - Özgeçmiş" yalnızca kısa listeye girmemiş adaylar; "Teklif Red" yalnızca teklif aşamasında kullanılır.</p><p><button class="btn p" onclick="setStage(S.cands.find(x=>x.id==='${c.id}'),$('rs').value);closeM();rerender()">Sonlandır ve bilgilendir</button></p>`);
 if(setStage(c,s))rerender()}

V.int=()=>{head('Mülakatlar','Planlanan görüşmeler adaya otomatik davet olarak gider, takvim (.ics) dosyası indirilebilir.',`<button class="btn p" onclick="schedule()">+ Mülakat Planla</button>`);
 const L=S.ints.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
 $('view').innerHTML=`<div class="glass card tw"><table><tr><th>Tarih</th><th>Saat</th><th>Aday</th><th>Pozisyon</th><th>Tür</th><th>Şekil</th><th>Görüşmeci</th><th>Sonuç</th><th></th></tr>${L.map(i=>{const c=S.cands.find(x=>x.id===i.cand)||{};return`<tr><td>${i.date}</td><td>${i.time}</td><td>${esc(c.ad)}</td><td>${esc(posOf(c).ad)}</td><td>${esc(i.tur)}</td><td>${esc(i.sekil)}</td><td>${esc(i.gorusmeci)}</td><td>${i.sonuc?`<span class="tag ${i.sonuc==='Olumlu'?'t-ok':i.sonuc==='Olumsuz'?'t-bad':'t-warn'}">${i.sonuc} ${i.puan}/5</span>`:'-'}</td><td class="row"><button class="btn s" onclick="score('${i.id}')">Form</button><button class="btn s" onclick="ics('${i.id}')">.ics</button></td></tr>`}).join('')||'<tr><td colspan=9 class="mut">Kayıt yok</td></tr>'}</table></div>`};
function schedule(cid){closeD();modal(`<h3>Mülakat Planla</h3><div class="fg"><div class="full"><label>Aday</label><select id="ic">${S.cands.filter(c=>!isClosed(c.asama)).map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.ad)} – ${esc(posOf(c).ad)}</option>`).join('')}</select></div>
 <div><label>Görüşme türü</label><select id="it"><option>Öngörüşme</option><option>Yönetici Görüşmesi</option><option>İnsan Kaynakları Görüşmesi</option><option>Üst Yönetim Görüşmesi</option></select></div><div><label>Görüşme şekli</label><select id="is">${opts('sekil','Online')}</select></div>
 <div><label>Tarih</label><input type="date" id="id" value="${today()}"></div><div><label>Saat</label><input type="time" id="ih" value="10:00"></div><div><label>Görüşmeci</label><input id="ig" list="dl_hm2"><datalist id="dl_hm2">${[...S.lists.hm,...S.lists.uzman].map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div><div><label>Yer / Toplantı bağlantısı</label><input id="iy"></div></div>
 <label style="display:flex;gap:8px;margin-top:12px;color:var(--tx)"><input type="checkbox" id="imv" checked style="width:auto"> Adayın aşamasını görüşme türüne taşı</label><p class="row"><button class="btn p" onclick="saveInt()">Planla & Davet Gönder</button></p>`)}
function saveInt(){const i={id:uid(),cand:$('ic').value,tur:$('it').value,sekil:$('is').value,date:$('id').value,time:$('ih').value,gorusmeci:$('ig').value,yer:$('iy').value};if(!i.cand)return;S.ints.push(i);const c=S.cands.find(x=>x.id===i.cand);
 if($('imv').checked&&ACTIVE.indexOf(i.tur)>ACTIVE.indexOf(c.asama))setStage(c,i.tur,true);trigger(c,'@mulakat',{tur:i.tur,tarih:i.date,saat:i.time,sekil:i.sekil,yer:i.yer||'-',gorusmeci:i.gorusmeci||'-'});log(`Mülakat planlandı: ${c.ad} ${i.date}`);save();closeM();rerender();toast('Mülakat planlandı, davet gönderildi')}
function ics(id){const i=S.ints.find(x=>x.id===id),c=S.cands.find(x=>x.id===i.cand)||{};const dt=(i.date+'T'+i.time).replace(/[-:]/g,'')+'00';const b=new Blob([`BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nUID:${i.id}@ats\nDTSTART:${dt}\nDURATION:PT1H\nSUMMARY:${i.tur} - ${c.ad}\nLOCATION:${i.yer||i.sekil}\nDESCRIPTION:${posOf(c).ad||''}\nEND:VEVENT\nEND:VCALENDAR`],{type:'text/calendar'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mulakat.ics';a.click()}
function score(id){const i=S.ints.find(x=>x.id===id);const K=['Teknik Yetkinlik','İletişim','Problem Çözme','Kültürel Uyum','Motivasyon'];
 modal(`<h3>Değerlendirme Formu – ${esc(i.tur)}</h3><div class="fg">${K.map((k,n)=>`<div><label>${k} (1-5)</label><input type="number" min=1 max=5 id="k${n}" value="${i.k?.[n]||3}"></div>`).join('')}<div><label>Öneri</label><select id="ks">${['Olumlu','Beklemede','Olumsuz'].map(x=>`<option ${i.sonuc===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="full"><label>Geri bildirim</label><textarea id="kf">${esc(i.fb||'')}</textarea></div></div><p><button class="btn p" onclick="saveScore('${id}')">Kaydet</button></p>`)}
function saveScore(id){const i=S.ints.find(x=>x.id===id);i.k=[0,1,2,3,4].map(n=>+$('k'+n).value);i.puan=(i.k.reduce((a,b)=>a+b)/5).toFixed(1);i.sonuc=$('ks').value;i.fb=$('kf').value;const c=S.cands.find(x=>x.id===i.cand);(c.notes=c.notes||[]).push({t:today(),m:`${i.tur} formu: ${i.sonuc} (${i.puan}/5) ${i.fb}`});save();closeM();
 rerender();if(i.sonuc==='Olumsuz')ask('Olumsuz değerlendirme. Adayın süreci sonlandırılsın ve bilgilendirme maili gönderilsin mi?',()=>{const m={'Öngörüşme':'Süreç Sonlandı - Öngörüşme','Yönetici Görüşmesi':'Süreç Sonlandı - Yönetici Görüşmesi','İnsan Kaynakları Görüşmesi':'Süreç Sonlandı - İnsan Kaynakları Görüşmesi','Üst Yönetim Görüşmesi':'Süreç Sonlandı - Üst Yönetim Görüşmesi'};setStage(c,m[i.tur]);rerender()})}

V.appr=()=>{head('Onaylarım (Yönetici)','HR Kısa Liste → yönetici CV onayı; Kişi Onay → yönetici kişi onayı.');const sel=filt.hm||'';
 const L=S.cands.filter(c=>['HR Kısa Liste','Kişi Onay'].includes(c.asama)&&(!sel||posOf(c).yonetici===sel));

 <div class="row" style="margin-top:12px"><button class="btn p s" onclick="appr('${c.id}','${ko?'Teklif':'HM Kısa Liste'}')">✓ ${ko?'Kişi Onayı Ver':'Görüşmek İsterim'}</button><button class="btn d s" onclick="appr('${c.id}','${ko?'Süreç Sonlandı - Kişi Onay':'Olumsuz - Özgeçmiş'}')">✕ Uygun Değil</button></div></div>`}).join('')||'<div class="glass card mut">Onay bekleyen aday yok.</div>'}</div>`};
function appr(id,st){const c=S.cands.find(x=>x.id===id);if(st==='Teklif')c.kisiOnayOnay=today();if(setStage(c,st))rerender()}

/* ===== Excel içe/dışa aktarım (orijinal başlıklarla) ===== */
const norm=s=>String(s||'').replace(/\s+/g,' ').trim().toLowerCase();
const dt=v=>v instanceof Date?new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString().slice(0,10):(v==='NA'?'':v??'');
function rows(ws,key){const a=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});const hi=a.findIndex(r=>r.some(c=>norm(c).startsWith(key)));if(hi<0)return[];const h=a[hi].map(norm);return a.slice(hi+1).filter(r=>r.some(c=>c!=='')).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]])))}
function pick(F,r){const o={};F.forEach(([k,l])=>{const h=Object.keys(r).find(x=>x.startsWith(norm(l).split(' (')[0]));if(h!=null&&r[h]!=='')o[k]=String(dt(r[h])).trim()});return o}
function importX(){const f=$('xf').files[0];if(!f)return toast('Dosya seçin');const fr=new FileReader();fr.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});let np=0,nc=0,nr=0;const sh=n=>wb.Sheets[wb.SheetNames.find(s=>norm(s).startsWith(n))];
 if(sh('liste')){const a=XLSX.utils.sheet_to_json(sh('liste'),{header:1,defval:''});const m={'pozisyon durumu':'pozDurum','pozisyon gerekçesi':'gerekce','işe alım yöneticisi':'uzman','işe alım kaynağı':'kaynak','lokasyon':'lokasyon','direktörlük':'direktorluk','müdürlük':'mudurluk','hiring manager':'hm','görüşme şekli':'sekil','mezuniyet seviyesi':'mezuniyet'};
  a[0].forEach((h,i)=>{const k=m[norm(h)];if(k)S.lists[k]=[...new Set(a.slice(1).map(r=>String(r[i]).trim()).filter(v=>v&&!v.startsWith('(')))]})}
 if(sh('rol')){rows(sh('rol'),'talep numarası').forEach(r=>{const o=pick(P_F,r);if(!o.id)return;o.id=+o.id;const ex=S.pos.find(p=>p.id==o.id);ex?Object.assign(ex,o):(S.pos.push(o),np++)})}
 if(sh('aday')){rows(sh('aday'),'talep numarası').forEach(r=>{const o=pick(C_F,r);if(!o.ad)return;const ex=S.cands.find(c=>c.ad===o.ad&&c.talepNo==o.talepNo);if(ex)return Object.assign(ex,o);
  S.cands.push(Object.assign({id:uid(),created:today(),stageDate:o.yoneticiGorusme||o.ongorusme||today(),hist:[{t:today(),m:'Excel\'den aktarıldı'}],as:{},notes:[]},o,{talepNo:+o.talepNo}));nc++})}
 if(sh('referans')){rows(sh('referans'),'aday ad').forEach(r=>{const o=pick(R_F,r);if(!o.ad||S.refs.some(x=>x.ad===o.ad))return;S.refs.push(Object.assign({id:uid()},o));nr++})}
 log(`Excel içe aktarım: ${np} pozisyon, ${nc} aday, ${nr} referans`);save();rerender();toast(`Aktarıldı: ${np} pozisyon, ${nc} aday, ${nr} referans (mevcutlar güncellendi)`)};fr.readAsArrayBuffer(f)}
function sheetOf(F,L,extra=[]){return XLSX.utils.aoa_to_sheet([[...F.map(f=>f[1]),...extra.map(e=>e[0])],...L.map(o=>[...F.map(([k])=>o[k]??''),...extra.map(e=>e[1](o))])])}
function exportX(ids){const wb=XLSX.utils.book_new();const cs=ids?S.cands.filter(c=>ids.includes(c.id)):S.cands;
 XLSX.utils.book_append_sheet(wb,sheetOf(P_F,S.pos),'Rol Bazlı');
 const CF=[['talepNo','Talep Numarası (Pozisyon Kodu)']];const PI=[['Pozisyon Adı',c=>posOf(c).ad],['Lokasyon',c=>posOf(c).lokasyon],['Direktörlük',c=>posOf(c).direktorluk],['Müdürlük',c=>posOf(c).mudurluk],['Pozisyon Yöneticisi',c=>posOf(c).yonetici],['İşe Alım Uzmanı',c=>posOf(c).uzman]];
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([[CF[0][1],...PI.map(x=>x[0]),...C_F.slice(1).map(f=>f[1]),...Object.values(ASSESS)],...cs.map(c=>[c.talepNo,...PI.map(x=>x[1](c)),...C_F.slice(1).map(([k])=>k==='kvkk'?(c.kvkk?'Evet':'Hayır'):c[k]??''),...Object.keys(ASSESS).map(k=>c.as?.[k]?.score??c.as?.[k]?.status??'')])]),'Aday Bazlı');
 if(!ids){XLSX.utils.book_append_sheet(wb,sheetOf(R_F,S.refs),'Referanslı Adaylar');XLSX.utils.book_append_sheet(wb,sheetOf([['date','Tarih'],['time','Saat'],['tur','Tür'],['sekil','Şekil'],['gorusmeci','Görüşmeci'],['sonuc','Sonuç'],['puan','Puan'],['fb','Geri Bildirim']],S.ints,[['Aday',i=>(S.cands.find(c=>c.id===i.cand)||{}).ad]]),'Mülakatlar')}
 XLSX.writeFile(wb,`Ise_Alim_Takip_${today()}.xlsx`)}
const exportSel=ids=>exportX(ids);

/* ===== Başlat ===== */
try{const t=localStorage.getItem('ats_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
load();page=location.hash.slice(1)||'dash';rerender();processQueue();
